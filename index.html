<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPOS Field App</title>
<style>
:root{--bg:#f4f3ee;--card:#ffffff;--text:#1c1e1a;--sub:#6c6f66;--accent:#2f6b3c;--accent-d:#245430;--warn:#c1531f;--border:#e2ded2;--radius:14px;--c-by:#1d5fa8;--c-date:#7b3fa0;--c-re:#c1531f;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;--c-by:#7db4ee;--c-date:#c8a2ea;--c-re:#f2a373;}}
:root[data-theme="dark"]{--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;--c-by:#7db4ee;--c-date:#c8a2ea;--c-re:#f2a373;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 0 14px;}
.topbar .name{font-weight:700;font-size:15px;}
.topbar .role{color:var(--sub);font-size:12px;}
h1{font-size:19px;margin:4px 0 12px;}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.btn{background:var(--accent);color:#fff;border:none;padding:13px 16px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;}
.btn:active{background:var(--accent-d);}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn.warn{background:var(--warn);}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
input[type=text],input[type=password],input[type=number]{width:100%;padding:13px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--text);}
.sub{color:var(--sub);font-size:13px;}
.sub.by{color:var(--c-by);font-weight:600;}   /* Assigned by   */
.sub.dt{color:var(--c-date);font-weight:600;} /* Date assigned */
.sub.re{color:var(--c-re);font-weight:600;}   /* Reassigned    */
.center{text-align:center;}
.timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:8px;margin-top:8px;}
.row>*{flex:1;}
.bed-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.bed-row:last-child{border-bottom:none;}
.bed-id{font-weight:700;}
.link{color:var(--accent);text-decoration:none;font-size:14px;display:inline-block;margin-top:10px;cursor:pointer;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent);color:#fff;}
.badge.paused{background:var(--warn);}
.err{color:var(--warn);font-size:13px;margin:8px 0;}
.banner{background:var(--warn);color:#fff;padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:10px;}
.act-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:8px;font-size:15px;color:var(--text);cursor:pointer;}
.act-btn.sel{border-color:var(--accent);background:rgba(47,107,60,0.12);}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent);background:rgba(47,107,60,0.12);padding:4px 10px;border-radius:20px;margin-bottom:10px;}
.conn-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.conn-pill.off{color:var(--warn);background:rgba(193,83,31,0.12);}
.conn-pill.off .dot{background:var(--warn);}
.detail-row{margin-top:6px;font-size:14px;}
.qa-grid{display:flex;gap:8px;margin:8px 0 2px;}
.qa-grid>*{flex:1;}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 4px;font-size:11.5px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;}
.qa-btn:active{background:rgba(47,107,60,0.12);}
.qa-icon{font-size:21px;}
.hist{font-size:13px;color:var(--sub);padding:6px 2px 0;border-top:1px solid var(--border);margin-top:8px;}
.hist-row{padding:4px 0;}
.progress{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--accent);padding:13px;border:1.5px dashed var(--accent);border-radius:var(--radius);margin-top:8px;}
.spin{width:16px;height:16px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.done-note{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:#fff;background:var(--accent);padding:13px;border-radius:var(--radius);margin-top:8px;}
.ok-note{color:var(--accent);font-weight:700;font-size:13px;margin-top:6px;}
.badge.done{background:var(--accent-d);}
.statusrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
.statusrow .conn-pill{margin-bottom:0;}
.clock{text-align:right;line-height:1.15;}
.clock .t{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.clock .d{font-size:11px;color:var(--sub);}
.tabs{display:flex;gap:4px;background:var(--border);padding:4px;border-radius:var(--radius);margin-bottom:12px;}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:calc(var(--radius) - 4px);font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;}
.tab.on{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
select{width:100%;padding:12px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.filters .full{grid-column:1/-1;}
.logsum{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 6px;font-size:13px;color:var(--sub);}
.logsum b{color:var(--text);}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 6px;}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.logdur{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ================= Backend wiring ================= */
const API_URL='https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';
const APP_KEY='WorkerApp';

async function api(action,payload){
 payload=Object.assign({action:action},payload||{});
 if(st.token && action!=='login') payload.token=st.token;
 const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
 const timer=ctl?setTimeout(()=>ctl.abort(),60000):null;   // never leave a button stuck on a request that will not answer
 try{
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined});
  const r=await res.json();
  st.connected=true;
  return r;
 }catch(e){ st.connected=false; return {ok:false,error:'Could not reach the server. Check your connection.',code:'NETWORK_ERROR'}; }
 finally{ if(timer)clearTimeout(timer); }
}
/** returns true if it handled (logged the user out) a dead-session error */
function handleAuthError(r){
 if(!r.ok && r.code==='UNAUTHENTICATED'){ st.err=r.error||'Your session ended. Sign in again.'; doLogout(false); return true; }
 return false;
}

/* ================= Static reference data =================
   Sourced directly from the live VPOS_System.xlsx (BED_MASTER, ACTIVITY_REFERENCE,
   COHORT_PRODUCTION). No worker-facing read endpoint exists yet on the backend for
   LIVE bed/cohort/status data, so BED_STATE_SNAPSHOT / COHORT_SNAPSHOT /
   ACTIVITY_LOG_SNAPSHOT below are this workbook's last-known state, not a live feed
   -- they need to be replaced by a real "get-bed-detail" / "get-bed-history" route
   (or refreshed by hand) to stay accurate. BED_MASTER.Zone is not populated for any
   bed in the current workbook, so Zone is omitted from the UI until that column has
   real data. */
const BLOCKS=[['B1','Block 1',55],['B2','Block 2',55],['B3','Block 3',55],['B4','Block 4',55],['Z5','Zone 5',11]];

// Bed_ID -> {status, cohortId} for any bed NOT at the BED_STATUS_RULES default (AVAILABLE, no cohort).
// NOTE: 'ASSIGNED' is the raw Bed_Status value currently in BED_MASTER for B4-01, but it is not one of
// the Valid_Bed_Status_Values on the BED_STATUS_RULES tab (AVAILABLE/RESERVED/PLANTED/GROWING/HARVEST
// READY/HARVESTING/POST-HARVEST ACTIVITIES/BLOCKED) -- per R02 a confirmed-but-unplanted cohort should
// read RESERVED. Shown as-is rather than silently relabeled; worth a data-integrity fix upstream.
const BED_STATE_SNAPSHOT={'B4-01':{status:'ASSIGNED',cohortId:'BET-C01'}};
const COHORT_SNAPSHOT={'BET-C01':{cropId:'BET',cropName:'Beets'}};
// Bed_ID -> [{activityName,workerId,endTime|startTime}], from FIELD_ACTIVITY_LOG. Currently empty workbook-wide.
const ACTIVITY_LOG_SNAPSHOT={};

// From ACTIVITY_REFERENCE (23 rows). workerExec mirrors Is_Worker_Executable exactly --
// only ACT_021 StateChange is manager-only and excluded from the worker picklist.
const ACTIVITIES=[
 {id:'ACT_001',name:'FieldPrep',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_002',name:'BedShaping',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_003',name:'Mulching',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_004',name:'TrellisingSetup',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_005',name:'IrrigationSetup',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_006',name:'Planting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_007',name:'DirectSeeding',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_008',name:'Transplanting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_009',name:'Replanting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_010',name:'Thinning',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_011',name:'Weeding',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_012',name:'Fertilizing',domain:'CropCare',qtyBased:true,unit:'lbs',workerExec:true},
 {id:'ACT_013',name:'IrrigationCheck',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_014',name:'PestControl',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_015',name:'DiseaseControl',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_016',name:'Pruning',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_017',name:'Trellising',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_018',name:'Harvest',domain:'Harvest',qtyBased:true,unit:'lbs',workerExec:true},
 {id:'ACT_019',name:'PostHarvestCleanup',domain:'Harvest',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_020',name:'FieldTurnover',domain:'Harvest',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_021',name:'StateChange',domain:'State',qtyBased:false,unit:'',workerExec:false},
 {id:'ACT_022',name:'CropCleanup',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_023',name:'Scouting',domain:'State',qtyBased:false,unit:'',workerExec:true}
];
function actById(id){return ACTIVITIES.find(a=>a.id===id);}

// Field Actions shortcuts. NOTE: ACTIVITY_REFERENCE has no literal "apply/run water" activity --
// IrrigationCheck ("Validate irrigation performance and detect anomalies") is the closest CropCare-stage
// match to "Log Water Pass" and is used here as a best guess. Please confirm this is the intended
// mapping (or tell me the correct Activity_ID) before relying on it.
const QUICK_ACTIONS=[
 {id:'ACT_013',icon:'💧',label:'Log Water Pass'},
 {id:'ACT_012',icon:'🧪',label:'Log Fertilizer'},
 {id:'ACT_011',icon:'🌿',label:'Log Weeding'}
];

function allBeds(){const out=[];for(const[p,,n]of BLOCKS){for(let i=1;i<=n;i++)out.push(p+'-'+String(i).padStart(2,'0'));}return out;}
function bedBlock(id){const p=id.split('-')[0];const b=BLOCKS.find(x=>x[0]===p);return b?b[1]:'';}
function bedDetail(id){
 const snap=BED_STATE_SNAPSHOT[id]||{};
 const status=snap.status||'AVAILABLE';
 const cohortId=snap.cohortId||null;
 const cohort=cohortId?COHORT_SNAPSHOT[cohortId]:null;
 return{bedId:id,block:bedBlock(id),zone:null,status:status,cohortId:cohortId,cropName:cohort?cohort.cropName:null};
}
function fmt(ms){if(ms<0)ms=0;let s=Math.floor(ms/1000);const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;
return(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
/** Date/time a manager assigned the task (FIELD_LIVE_SESSION.Assigned_Time), e.g. "Oct 26, 2026, 10:50 AM". Blank when none. */
function fmtAssigned_(v){ if(!v)return ''; const d=new Date(v); if(isNaN(d.getTime()))return String(v); return d.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }
function elapsed(s){const paused=s.totalPausedMs||0;if(s.status==='paused')return s.pausedAt-s.startTime-paused;
if(s.status==='completed')return s.endTime-s.startTime-paused;return Date.now()-s.startTime-paused;}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortName(n){return(n||'').trim().split(/\s+/)[0]||n;}

/* ================= Server-backed sessions, with a local completed-history cache =================
   FIELD_LIVE_SESSION on the server is the source of truth for ACTIVE/PAUSED sessions -
   syncActiveSessions_() below calls the 'get-my-sessions' action (ActivityEngine.gs's
   getLiveSessions({workerId: auth.workerId}), scoped server-side to the logged-in worker,
   not whatever this device happens to remember) and replaces the active/paused portion of
   st.sessions with the real thing. This is what makes a session another device started (or
   one a manager started via ranch_aab / reassigned to this worker) actually show up here.
   Completed rows: the Log tab merges this device's own localStorage with the server's 'get-my-completed'
   (WorkerLog.gs, read from FIELD_ACTIVITY_LOG, scoped to the logged-in worker), so a task finished on
   ANOTHER device, or closed by a manager, shows here too. If that route is not deployed or fails, the
   Log silently falls back to this device's own rows. */
/** FIELD_ACTIVITY_LOG row (from get-my-completed) -> the completed-session shape the Log tab reads. */
function mapServerDone_(r){
 const a=actByName(r.activityName)||{};
 const start=new Date(r.startTime).getTime(), end=new Date(r.endTime).getTime();
 const s0=isNaN(start)?end:start;
 // elapsed() = end - start - totalPausedMs; the server's Elapsed_Minutes already excludes pauses, so back the paused time out of it.
 const paused=Math.max(0,(end-s0)-Math.round((Number(r.elapsedMinutes)||0)*60000));
 return {id:r.id||r.logId, workerId:st.me.workerId, bedId:r.bedId, block:bedBlock(r.bedId), activityId:r.activityId||a.id||'',
  activityName:r.activityName||'', qtyBased:!!a.qtyBased, unit:r.unit||a.unit||'', status:'completed',
  startTime:s0, endTime:end, totalPausedMs:paused, pausedAt:null};
}
function sessSig_(){return JSON.stringify(st.sessions.map(s=>[s.id,s.status,s.pauseType,s.activityName,s.bedId,s.assignedTime,s.managerName,s.reassignedFromName,s.description,Math.round((s.totalPausedMs||0)/1000)]));}
function allSessions(){try{return JSON.parse(localStorage.getItem('vpos_sessions')||'[]');}catch(e){return[];}}
function saveSessions(arr){localStorage.setItem('vpos_sessions',JSON.stringify(arr));}
function actByName(name){return ACTIVITIES.find(a=>a.name===name);}
/** Raw FIELD_LIVE_SESSION row (from get-my-sessions) -> the shape renderHome() expects. */
function splitList_(v){return String(v||'').split(',').map(x=>x.trim()).filter(x=>x.length);}
/** Turns a session's Pause_Time(s)/Resume_Time(s) comma-lists (same pairing convention
 *  computeElapsedMinutes_() uses server-side in ActivityEngine.gs) into what elapsed()
 *  needs: totalPausedMs is every already-closed pause span added together, pausedAt is
 *  the start of the still-open pause (or null if the session isn't currently paused).
 *  mapServerSession_() used to hardcode {totalPausedMs:0, pausedAt:null} for every synced
 *  session, which made elapsed() compute a huge negative number for anything paused --
 *  fmt() then clamped that to zero, so every paused timer looked reset. */
function pauseState_(pauseTimesStr,resumeTimesStr,isPaused){
 const pauses=splitList_(pauseTimesStr).map(t=>new Date(t).getTime());
 const resumes=splitList_(resumeTimesStr).map(t=>new Date(t).getTime());
 let totalPausedMs=0,pausedAt=null;
 for(let i=0;i<pauses.length;i++){
  if(i<resumes.length)totalPausedMs+=Math.max(0,resumes[i]-pauses[i]);
  else pausedAt=pauses[i]; // this one hasn't been resumed yet
 }
 return {totalPausedMs, pausedAt: isPaused?pausedAt:null};
}
function mapServerSession_(r){
 const a=actByName(r.Activity_Name)||{};
 const rawStatus=String(r.Status||'').toUpperCase();
 const isPaused=rawStatus==='PAUSED';
 // FIX (bug 7 frontend half): a manager-assigned or freshly-reassigned session
 // lands here with Status=ASSIGNED and a blank Start_Time (see startSession_()/
 // reassignActivity() in ActivityEngine.gs) - this used to fall through the
 // isPaused?'paused':'active' check straight into 'active', with no branch for
 // ASSIGNED at all. That's what made a reassigned task show up already running
 // (badge ACTIVE, a timer ticking off of an Invalid Date) instead of prompting
 // the worker to tap Start - the backend was correctly waiting for the worker,
 // the frontend just had no way to display that wait state.
 const isAssigned=rawStatus==='ASSIGNED';
 // 'Pause_Reason(s)' is a comma-list parallel to Pause_Time(s) (see ActivityEngine.gs
 // pauseActivity()) - only present once that column's been added to the sheet. The
 // last entry is whichever pause type (Break/Lunch/End of Day) is currently active.
 const reasons=splitList_(r['Pause_Reason(s)']);
 const ps=pauseState_(r['Pause_Time(s)'],r['Resume_Time(s)'],isPaused);
 return {
  id:r.Session_ID, workerId:st.me.workerId, bedId:r.Bed_ID, block:bedBlock(r.Bed_ID),
  activityId:a.id||'', activityName:r.Activity_Name||'', qtyBased:!!a.qtyBased, unit:a.unit||'', isFertilizer:r.Is_Fertilizer===true,
  // An EXCEPTION row is still an open session, so it still renders as 'active'
  // rather than disappearing (only ACTIVE/PAUSED/ASSIGNED/EXCEPTION reach here at
  // all - COMPLETED rows drop out of get-my-sessions).
  status: isAssigned?'assigned':(isPaused?'paused':'active'),
  pauseType: isPaused?(reasons[reasons.length-1]||''):'',
  // Start_Time is genuinely blank while ASSIGNED (no clock running yet) - leave
  // startTime null rather than new Date('').getTime() (NaN), so nothing downstream
  // tries to render a bogus elapsed time for a task that hasn't started.
  startTime: isAssigned?null:new Date(r.Start_Time).getTime(), totalPausedMs:ps.totalPausedMs, pausedAt:ps.pausedAt,
  // Set only when a manager assigned/reassigned this session (worker self-started
  // tasks have no Manager_ID) - see reassignActivity()/get-my-sessions in the backend.
  managerName:r.Manager_Name||'', reassignedFromName:r.Reassigned_From_Name||r.Reassigned_From||'',
  assignedTime:r.Assigned_Time||r.assignedTime||'',
  // FIX: "My Active Sessions" only ever showed the bare Activity_Name label (e.g.
  // "Mulching") with nothing explaining what the activity actually is. Server now
  // joins ACTIVITY_REFERENCE.Description onto get-my-sessions rows the same way it
  // already did for get-activity-history (see withActivityDescription_ in Code_main.gs).
  description:r.Description||''
 };
}

let tickTimer=null;
let syncSeq=0;
let st={screen:'login',me:null,token:null,workerIdInput:'',pinInput:'',err:null,busy:false,connected:false,
 sessions:[],scanQuery:'',selBed:null,selAct:null,showAllActs:false,showHistory:false,logRange:'7d',logAct:'',logBlock:'',logQuery:'',completingId:null,qty:'',unit:'',notes:'',isFinal:false,
 pausingId:null,pauseReason:'',startingId:null,pending:{},cardErr:{},lastChange:0,holds:{},flash:{}};
const HOLD_MS=60000;   // how long a just-confirmed Start is trusted over a server answer that has not caught up

const PAUSE_TYPES=['Break','Lunch','End of Day'];

/* Login is kept per TAB (sessionStorage), not per browser (localStorage): a new tab or window now opens on the
   login screen, and two tabs can be signed in as different workers without overwriting each other. A refresh in the
   same tab keeps you signed in. The old localStorage copy is deleted so nobody is auto-logged-in from it. */
try{localStorage.removeItem('vpos_session');}catch(e){}
try{
 const sess=JSON.parse(sessionStorage.getItem('vpos_session')||'null');
 if(sess&&sess.token&&sess.me){st.me=sess.me;st.token=sess.token;st.screen='home';st.connected=true;}
}catch(e){}
function loadForMe(){st.sessions=allSessions().filter(s=>s.workerId===st.me.workerId).sort((a,b)=>b.startTime-a.startTime);}
if(st.me)loadForMe(); // instant paint from local cache; syncActiveSessions_() below reconciles with the server

/** Replaces the active/paused portion of st.sessions with server truth; keeps local completed rows. */
async function syncActiveSessions_(force){
 if(!st.me)return;
 const seq=++syncSeq, startedAt=Date.now();
 const [r,rc]=await Promise.all([api('get-my-sessions',{}),api('get-my-completed',{})]);
 if(handleAuthError(r))return;
 if(rc&&rc.ok&&Array.isArray(rc.data))st.serverDone=rc.data.map(mapServerDone_).filter(x=>x.id&&!isNaN(x.endTime));   // on failure keep the last good copy
 // A slow answer that left BEFORE the worker tapped Start/Complete describes the old state. Applying it put the card back to
 // 'Start' / 'Complete' after the tap had worked, which is why the worker had to tap again. Only the newest, post-tap answer counts.
 if(seq!==syncSeq||startedAt<st.lastChange)return;
 if(!r.ok){st.err=r.error||'Could not refresh your sessions.';render();return;}
 const localOnly=allSessions().filter(s=>s.workerId===st.me.workerId&&s.status==='completed');
 const haveLocal={};localOnly.forEach(x=>{haveLocal[x.id]=1;});
 const localCompleted=localOnly.concat((st.serverDone||[]).filter(x=>!haveLocal[x.id]));   // this device's own row wins; the server adds the rest
 // FIX: get-my-sessions can still return a row that is already finished (workbook says COMPLETED), and this
 // mapper used to turn anything that was not PAUSED/ASSIGNED into 'active' - so a task you just completed
 // came straight back as a running card (timer counting from its start time) next to its Completed History
 // entry. Closed rows are dropped here, and so is any session this device has already completed, in case the
 // server answers a moment before it has caught up.
 const CLOSED_=/^(COMPLETED|COMPLETE|ENDED|CLOSED|CANCELLED|CANCELED|REASSIGNED|ABANDONED)$/;
 const doneIds={};localCompleted.forEach(x=>{doneIds[x.id]=1;});
 let serverActive=(r.data||[]).filter(x=>!CLOSED_.test(String(x.Status||'').trim().toUpperCase())&&!String(x.End_Time||'').trim()&&!doneIds[x.Session_ID]).map(mapServerSession_).map(x=>{ const mid=st.pending[x.id]&&st.sessions.find(c=>c.id===x.id); return mid||x; });   // a card mid-action keeps its on-screen state
 // A Start the worker already confirmed is trusted for HOLD_MS: if the server still lists it as waiting (or has not listed it yet),
 // keep it ACTIVE instead of flipping the card back to \"Start\". Once the server agrees, the hold is dropped.
 const now=Date.now();
 Object.keys(st.holds).forEach(id=>{
  const h=st.holds[id];
  if(!h||now>h.until||doneIds[id]){delete st.holds[id];return;}
  const i=serverActive.findIndex(x=>x.id===id);
  if(i<0)serverActive.push(h.session);
  else if(serverActive[i].status==='assigned')serverActive[i]=Object.assign({},serverActive[i],{status:'active',startTime:h.session.startTime,totalPausedMs:0,pausedAt:null});
  else delete st.holds[id];
 });
 const before=sessSig_();
 st.sessions=serverActive.concat(localCompleted).sort((a,b)=>b.startTime-a.startTime);
 // Redraw only when something on screen changed. Rebuilding the page for nothing is what swallowed taps (a tap that lands
 // while the DOM is replaced never fires) and dropped focus from the Notes/Quantity box.
 if(force||before!==sessSig_()||st.err)render();
}
if(st.me)syncActiveSessions_();

/* ---- One tap = one action ---------------------------------------------------------------------
   Start:    tap Start -> "Starting…" -> session ACTIVE with Pause / Complete.
   Complete: tap Complete -> "Mark … as complete?" -> Confirm Complete -> "Completing…" -> moved to Completed History.
   Each session has its own pending state, so one card's action never disables or resets another. If the reply is lost
   (slow Apps Script, dropped signal) the app asks the server what happened before showing a failure, so a tap that
   actually worked is never reported as failed and never has to be repeated. */
function isTransient_(r){return !!r&&!r.ok&&(r.code==='NETWORK_ERROR'||r.code==='SERVER_ERROR');}
const LIVE_STATUS_=/^(ACTIVE|PAUSED|EXCEPTION)$/;
async function mySessionRows_(){const r=await api('get-my-sessions',{});return(r&&r.ok&&Array.isArray(r.data))?r.data:null;}
async function findLiveSession_(bedId,activityName){
 const rows=await mySessionRows_();if(!rows)return null;
 return rows.find(x=>x.Bed_ID===bedId&&x.Activity_Name===activityName&&LIVE_STATUS_.test(String(x.Status||'').trim().toUpperCase())&&!String(x.End_Time||'').trim())||null;
}
async function sessionIsClosed_(id){
 const rows=await mySessionRows_();if(!rows)return false;
 const row=rows.find(x=>x.Session_ID===id);
 return !row||!LIVE_STATUS_.test(String(row.Status||'').trim().toUpperCase())||!!String(row.End_Time||'').trim();
}
async function confirmStart(src){
 if(st.startingId||st.busy)return;
 if(!st.selBed)return;
 if(!st.selAct){st.err='Choose a Field Action or an activity first.';st.showAllActs=true;render();return;}
 const bedId=st.selBed,act=st.selAct;
 st.startingId=(typeof src==='string'?src:'task');   // only the button that was pressed shows "Starting..."; the rest stay normal
 st.err=null;st.lastChange=Date.now();render();
 let r=await api('start-activity',{bedId:bedId,activityName:act.name});
 if(handleAuthError(r)){st.startingId=null;return;}
 if(isTransient_(r)){const live=await findLiveSession_(bedId,act.name);if(live)r={ok:true,data:{sessionId:live.Session_ID}};}   // it did start; only the reply was lost
 st.startingId=null;st.lastChange=Date.now();
 if(!r.ok){st.err=r.error||('Could not start that activity ('+(r.code||'error')+').');render();return;}
 const arr=allSessions();
 if(!arr.some(x=>x.id===r.data.sessionId))arr.push({id:r.data.sessionId,workerId:st.me.workerId,bedId:bedId,block:bedBlock(bedId),
  activityId:act.id,activityName:act.name,qtyBased:act.qtyBased,unit:act.unit,isFertilizer:/fertiliz|fertigat/i.test(act.name||''),
  status:'active',startTime:Date.now(),totalPausedMs:0,pausedAt:null});
 saveSessions(arr);loadForMe();
 const made=st.sessions.find(x=>x.id===r.data.sessionId);
 if(made){st.holds[made.id]={until:Date.now()+HOLD_MS,session:made};st.flash[made.id]='started';setTimeout(()=>{delete st.flash[made.id];if(st.screen==='home')render();},2500);}
 go('home');syncActiveSessions_();
}

/** FIX (bug 7 frontend half): starts a session that's sitting here as
 *  'assigned' (manager-assigned or just reassigned to this worker). Reuses
 *  the same start-activity route confirmStart() calls - the backend's
 *  findAssignedSession_(auth.workerId,bedId,activityName) finds this exact
 *  row (Status=ASSIGNED already, from startSession_()/reassignActivity() in
 *  ActivityEngine.gs) and activates it in place via activateAssignedSession_(),
 *  rather than creating a duplicate session the way confirmStart()'s own
 *  optimistic local push would if reused as-is here. No local cache push is
 *  needed either - this session is already in st.sessions/localStorage from
 *  the server sync that surfaced it as 'assigned' in the first place; a
 *  fresh syncActiveSessions_() after the call picks up its new ACTIVE state
 *  and real Start_Time. */
async function confirmStartAssigned(id,bedId,activityName){
 if(st.pending[id])return;
 st.pending[id]='starting';delete st.cardErr[id];st.err=null;st.lastChange=Date.now();render();   // only THIS card shows "Starting..."
 let r=await api('start-activity',{bedId,activityName});
 if(handleAuthError(r)){delete st.pending[id];return;}
 if(isTransient_(r)&&await findLiveSession_(bedId,activityName))r={ok:true};   // it did start; only the reply was lost
 delete st.pending[id];st.lastChange=Date.now();
 if(!r.ok){st.cardErr[id]=r.error||('Could not start that activity ('+(r.code||'error')+'). Tap Start to try again.');render();return;}
 const cur=st.sessions.find(x=>x.id===id);   // running right away; the sync below brings the real Start_Time
 if(cur){
  cur.status='active';cur.startTime=Date.now();cur.totalPausedMs=0;cur.pausedAt=null;
  st.holds[id]={until:Date.now()+HOLD_MS,session:Object.assign({},cur)};
  st.flash[id]='started';setTimeout(()=>{delete st.flash[id];if(st.screen==='home')render();},2500);
 }
 render();syncActiveSessions_();
}
/** Patches session `id` in st.sessions directly, so the change shows immediately,
 *  then mirrors it into the local completed-history cache. Most active/paused sessions
 *  come from the server (syncActiveSessions_) and were never written into that cache --
 *  this used to just bail out (idx<0) for them, and the trailing loadForMe() would then
 *  rebuild st.sessions from the cache alone, making the session disappear from the
 *  screen until the next full sync. That's why pause/resume looked like it needed a
 *  refresh to take effect. */
function localUpdate(id,patch){
 st.lastChange=Date.now();
 const idx=st.sessions.findIndex(s=>s.id===id);
 if(idx>=0)st.sessions[idx]=Object.assign({},st.sessions[idx],patch);
 const cache=allSessions();
 const cIdx=cache.findIndex(s=>s.id===id);
 if(cIdx>=0)cache[cIdx]=Object.assign(cache[cIdx],patch);
 else if(idx>=0)cache.push(st.sessions[idx]);
 saveSessions(cache);
}
/** Opens the pause-type picker for a session (Pause button no longer pauses immediately -

function openPause(id){st.pausingId=id;st.pauseReason='';st.err=null;render();}
function cancelPause(){st.pausingId=null;render();}
async function confirmPause(id){
 if(st.busy||!st.pauseReason)return;
 st.busy=true;st.err=null;render();
 const r=await api('pause-activity',{sessionId:id,reason:st.pauseReason});
 st.busy=false;
 if(handleAuthError(r))return;
 if(!r.ok){st.err=r.error||('Could not pause that task ('+(r.code||'error')+').');render();return;}
 st.pausingId=null;
 localUpdate(id,{status:'paused',pausedAt:Date.now(),pauseType:st.pauseReason});render();
}
async function resumeS(id){
 if(st.busy)return;
 const s=st.sessions.find(x=>x.id===id);st.err=null;
 st.busy=true;render();

 st.busy=false;
 if(handleAuthError(r))return;
 if(!r.ok){st.err=r.error||('Could not resume that task ('+(r.code||'error')+').');render();return;}
 localUpdate(id,{status:'active',pausedAt:null,pauseType:'',totalPausedMs:(s.totalPausedMs||0)+(Date.now()-s.pausedAt)});render();
}

function fertBlank_(){return {type:'',brand:'',qty:'',unit:'lbs',method:''};}

  <label style="margin-top:8px;">Application method</label><select onchange="st.fert.method=this.value">${sel(f.method,[['','Not stated'],['Foliar','Foliar'],['Side-Dress','Side-Dress'],['Drip Line','Drip Line']])}</select>`;

function openComplete(id){if(st.pending[id])return;st.fert=fertBlank_();st.completingId=id;st.qty='';st.unit=(st.sessions.find(x=>x.id===id)||{}).unit||'';st.notes='';st.isFinal=false;st.grade='';st.coldChain=true;render();}
async function confirmComplete(id){
 const s=st.sessions.find(x=>x.id===id);if(!s||st.pending[id])return;
 if(s.activityId==='ACT_018'&&!(Number(st.qty)>0)){st.cardErr[id]='Enter how much was harvested before finishing.';render();return;}
 if(isFert_(s)){const miss=fertMissing_();if(miss.length){st.cardErr[id]='Enter the '+miss.join(', ')+' before finishing.';render();return;}}
 st.pending[id]='completing';delete st.cardErr[id];st.err=null;st.lastChange=Date.now();render();
 let r=await api('end-activity',{sessionId:id,fertilizer:isFert_(s)?fertPayload_():undefined,quantity:isFert_(s)?Number(st.fert.qty):st.qty,unit:st.unit,notes:st.notes,isFinalHarvest:!!st.isFinal,grade:st.grade||'',coldChainCompliant:s.activityId==='ACT_018'?!!st.coldChain:undefined});
 if(handleAuthError(r)){delete st.pending[id];return;}
 // A lost reply, or "not active" because the first tap already closed it: ask the server before calling it a failure.
 if(isTransient_(r)||(!r.ok&&r.code==='SESSION_NOT_ACTIVE')){if(await sessionIsClosed_(id))r={ok:true};}
 delete st.pending[id];
 if(!r.ok&&r.code==='FERTILIZER_INPUTS_REQUIRED'){localUpdate(id,{isFertilizer:true});}
 if(!r.ok){st.cardErr[id]=r.error||('Could not complete that task ('+(r.code||'error')+'). Tap Confirm Complete to try again.');render();return;}
 delete st.holds[id];
 localUpdate(id,{status:'completed',endTime:Date.now()});
 st.completingId=null;
 st.flash[id]='completed';   // card stays on screen for a moment showing \"Completed\", then moves to Completed History
 render();syncActiveSessions_();
 setTimeout(()=>{delete st.flash[id];if(st.screen==='home')render();},1600);
}

/* ---- Live clock (patched in place every second, so it never rebuilds the page or steals focus) ---- */
function clockT_(){return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});}
function clockD_(){return new Date().toLocaleDateString([],{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function tickClock_(){
 const t=document.querySelectorAll('[data-clock="t"]'),d=document.querySelectorAll('[data-clock="d"]');
 if(t.length){const a=clockT_(),b=clockD_();t.forEach(e=>{e.textContent=a;});d.forEach(e=>{e.textContent=b;});}
}
setInterval(tickClock_,1000);

/* ---- Log tab: completed tasks, filtered ---- */
function doneRows_(){return st.sessions.filter(s=>s.status==='completed'&&st.flash[s.id]!=='completed');}
function endOf_(s){return s.endTime||s.startTime||0;}
function dayKey_(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayLabel_(ms){
 const k=dayKey_(ms),today=new Date(),y=new Date();y.setDate(y.getDate()-1);
 if(k===dayKey_(today.getTime()))return 'Today';
 if(k===dayKey_(y.getTime()))return 'Yesterday';
 return new Date(ms).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function timeOf_(ms){return ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';}
function filteredLog_(){
 const now=new Date();let from=0;
 if(st.logRange==='today'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();}
 else if(st.logRange==='7d'){from=Date.now()-7*86400000;}
 const q=(st.logQuery||'').trim().toUpperCase();
 return doneRows_().filter(s=>endOf_(s)>=from
   &&(!st.logAct||s.activityName===st.logAct)
   &&(!st.logBlock||s.block===st.logBlock)
   &&(!q||String(s.bedId).toUpperCase().includes(q)))
  .sort((a,b)=>endOf_(b)-endOf_(a));
}
function logListHtml_(){
 const rows=filteredLog_();
 if(!rows.length)return `<p class="sub" style="margin-top:14px;">${doneRows_().length?'No completed tasks match these filters.':'No completed tasks yet.'}</p>`;
 const total=rows.reduce((a,s)=>a+Math.max(0,elapsed(s)),0);
 let out=`<div class="logsum"><span><b>${rows.length}</b> task${rows.length===1?'':'s'}</span><span>Total time <b>${fmt(total)}</b></span></div>`;
 const groups={},order=[];
 rows.forEach(s=>{const k=dayKey_(endOf_(s));if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(s);});
 order.forEach(k=>{
  const g=groups[k],t=g.reduce((a,s)=>a+Math.max(0,elapsed(s)),0);
  out+=`<div class="dayhead"><span>${esc(dayLabel_(endOf_(g[0])))}</span><span>${g.length} · ${fmt(t)}</span></div>`;
  out+=g.map(s=>`<div class="card"><div class="logrow"><div>
    <div style="font-weight:700;">${esc(s.bedId)} · ${esc(s.block)}</div>
    <div class="sub">${esc(s.activityName)}</div>
    <div class="sub">${esc(timeOf_(s.startTime))} – ${esc(timeOf_(s.endTime))}</div></div>
    <div class="logdur">${fmt(elapsed(s))}</div></div></div>`).join('');
 });
 return out;
}

function renderHome(){
 // FIX (bug 7 frontend half): 'assigned' sessions (manager-assigned or just
 // reassigned to this worker, not yet started) belong on this list too - they
 // were already coming back from get-my-sessions (it applies no status filter),
 // they just fell out of this specific filter, which only ever asked for
 // active/paused. Without this they'd have been invisible here even after
 // mapServerSession_ started tagging them correctly.
 const active=st.sessions.filter(s=>s.status==='active'||s.status==='paused'||s.status==='assigned'||(s.status==='completed'&&st.flash[s.id]==='completed'));
  return `${header()}
 ${tabsHtml_('home')}
 <div class="row" style="margin-bottom:2px;"><h1 style="flex:2;">My Active Sessions</h1>
 <button class="btn secondary" style="flex:1;" onclick="syncActiveSessions_(true)">Refresh</button></div>
 <p class="sub" style="margin:0 0 10px;">Logged in as ${esc(st.me.name)} (${esc(shortName(st.me.name))})</p>
 ${errBanner()}
 ${active.length===0?'<p class="sub">No active tasks right now. Scan a bed to start one.</p>':
   active.map(s=>{
    const completing=st.completingId===s.id;
    const pausing=st.pausingId===s.id;
    // FIX (bug 7 frontend half): an 'assigned' session has no clock running and
    // must not offer Pause/Resume/Complete - none of those are valid until the
    // worker actually starts it. Badge reads WAITING, the timer column shows
    // "Not started" instead of a fmt(elapsed()) call (elapsed() has no branch
    // for a null startTime), and the only action is Start, which reuses the
    // existing start-activity route - it finds this exact ASSIGNED row via
    // findAssignedSession_(workerId,bedId,activityName) and activates it in
    // place (see startActivity() in ActivityEngine.gs), the same one the
    // manager's assignment or reassignment already created.
    const assigned=s.status==='assigned';
    const justDone=s.status==='completed';
    const starting=st.pending[s.id]==='starting', completingNow=st.pending[s.id]==='completing';
    return `<div class="card">
    <div class="row" style="margin-bottom:6px;"><div>
      <span class="badge ${s.status==='paused'?'paused':''}${justDone?'done':''}">${assigned?(starting?'STARTING':'WAITING'):(completingNow?'COMPLETING':s.status.toUpperCase())}${s.status==='paused'&&s.pauseType?' · '+esc(s.pauseType):''}</span>
      <div style="font-weight:700;margin-top:6px;">${esc(s.bedId)} · ${esc(s.block)}</div>
      <div class="sub">${esc(s.activityName)}</div>
      ${s.description?`<div class="sub">${esc(s.description)}</div>`:''}
      ${s.reassignedFromName?`<div class="sub re">↩ Reassigned from ${esc(s.reassignedFromName)}${s.managerName?' by '+esc(s.managerName):''}</div>`
        :s.managerName?`<div class="sub by">Assigned by ${esc(s.managerName)}</div>`:''}
      ${fmtAssigned_(s.assignedTime)?`<div class="sub dt">Date assigned: ${esc(fmtAssigned_(s.assignedTime))}</div>`:''}</div>
      <div class="timer" id="timer-${s.id}" style="text-align:right;">${assigned?'Not started':fmt(elapsed(s))}</div></div>
    ${st.cardErr[s.id]?`<div class="banner">${esc(st.cardErr[s.id])}</div>`:''}
    ${justDone?`<div class="done-note">✓ Completed</div>`:assigned?(starting?`
      <div class="progress"><span class="spin"></span>Starting…</div>`:`
      <div class="row">
        <button class="btn block" onclick="confirmStartAssigned('${s.id}','${esc(s.bedId)}','${esc(s.activityName)}')">Start</button>
      </div>`):completingNow?`
      <div class="progress"><span class="spin"></span>Completing…</div>`:completing?`
      <div class="sub" style="font-weight:700;margin:2px 0 6px;">Mark ${esc(s.activityName)} on ${esc(s.bedId)} as complete?</div>
      ${isFert_(s)?fertForm_():''}
      ${s.qtyBased&&!isFert_(s)?`<label>Quantity (${esc(s.unit)})</label><input type="number" value="${esc(st.qty)}" oninput="st.qty=this.value">`:''}
      ${s.activityId==='ACT_018'?`<label style="margin-top:8px;">Grade</label><select onchange="st.grade=this.value"><option value="" ${!st.grade?'selected':''}>Not graded</option>${['A','B','C','Cull'].map(g=>`<option value="${g}" ${st.grade===g?'selected':''}>${g}</option>`).join('')}</select><div class="chk"><input type="checkbox" id="ccChk" ${st.coldChain?'checked':''} onchange="st.coldChain=this.checked"><label for="ccChk" style="margin:0;">Cold chain OK (kept cool and shaded)</label></div>`:''}
      ${s.activityId==='ACT_018'?`<div class="chk"><input type="checkbox" id="finalChk" ${st.isFinal?'checked':''} onchange="st.isFinal=this.checked"><label for="finalChk" style="margin:0;">Final harvest for this cohort</label></div>`:''}
      <label style="margin-top:8px;">Notes (optional)</label><input type="text" value="${esc(st.notes)}" oninput="st.notes=this.value">
      <div class="row">
        <button class="btn secondary" onclick="st.completingId=null;render()">Cancel</button>
        <button class="btn warn" onclick="confirmComplete('${s.id}')">Confirm Complete</button>
      </div>`:pausing?`
      <label style="margin-top:8px;">Pause type</label>
      <div class="row" style="flex-wrap:wrap;gap:6px;">
        ${PAUSE_TYPES.map(t=>`<button class="btn secondary" style="flex:none;${st.pauseReason===t?'font-weight:700;text-decoration:underline;':''}" onclick="st.pauseReason='${t}';render()">${esc(t)}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn secondary" ${st.busy?'disabled':''} onclick="cancelPause()">Cancel</button>
        <button class="btn secondary" ${st.busy||!st.pauseReason?'disabled':''} onclick="confirmPause('${s.id}')">${st.busy?'Pausing…':'Confirm Pause'}</button>
      </div>`:`
      ${st.flash[s.id]==='started'&&s.status==='active'?'<div class="ok-note">✓ Started - timer running</div>':''}
      <div class="row">
        ${s.status==='active'?`<button class="btn secondary" ${st.busy?'disabled':''} onclick="openPause('${s.id}')">Pause</button>`
          :`<button class="btn secondary" ${st.busy?'disabled':''} onclick="resumeS('${s.id}')">${st.busy?'Resuming…':'Resume'}</button>`}
        <button class="btn warn" onclick="openComplete('${s.id}')">Complete</button>
      </div>`}
    </div>`;}).join('')}
 <button class="btn block" style="margin:14px 0;" onclick="startNewTask()">+ Start New Task</button>`;
}

function bedResultsHtml(){
 const q=(st.scanQuery||'').trim().toUpperCase();
 const results=q?allBeds().filter(b=>b.includes(q)).slice(0,30):[];
 return results.length?results.map(b=>{const d=bedDetail(b);
   return `<div class="bed-row" onclick="selectBed('${b}')">
   <div><div class="bed-id">${b}</div><div class="sub">${esc(d.block)} · ${esc(d.cropName?('Growing '+d.cropName):d.status)}</div></div>
   <div class="sub">›</div></div>`;}).join(''):`<p class="sub">${q?'No matching beds.':'Type a bed ID or block prefix (B1, B2, B3, B4, Z5) to search.'}</p>`;
}
function onScanQueryInput(v){
 st.scanQuery=v;
 const el=document.getElementById('bedResults');
 if(el)el.innerHTML=bedResultsHtml();
}
function renderScan(){
 return `${header()}
 <h1>Scan Location</h1>
 <p class="sub">Scan or Enter QR Code</p>
 <input type="text" placeholder="e.g. B1-01" value="${esc(st.scanQuery)}"
   oninput="onScanQueryInput(this.value)" onkeydown="if(event.key==='Enter')processScan()">
 <button class="btn block" style="margin-top:10px;" onclick="processScan()">Process Scan</button>
 ${errBanner()}
 <p class="sub" style="margin-top:18px;">Or Search Beds (no camera needed)</p>
 <input id="bedSearchBox" type="text" placeholder="Type a bed ID or block prefix (B1, B2, B3, B4, Z5)" value="${esc(st.scanQuery)}"
   oninput="onScanQueryInput(this.value)" onkeydown="if(event.key==='Enter')processScan()">
 <div class="card" id="bedResults" style="margin-top:10px;">${bedResultsHtml()}</div>
 <p class="link" onclick="go('home')">‹ Back to My Sessions</p>`;
}

function bedHistoryHtml(bedId){
 const rows=ACTIVITY_LOG_SNAPSHOT[bedId]||[];
 if(!rows.length)return '<div class="hist">No prior activity logged for this bed yet.</div>';
 return '<div class="hist">'+rows.map(r=>`<div class="hist-row">${esc(r.activityName)} — ${esc(r.workerId)} (${new Date(r.endTime||r.startTime).toLocaleDateString()})</div>`).join('')+'</div>';
}

function renderAssignment(){
 const d=bedDetail(st.selBed);
 const worker=ACTIVITIES.filter(a=>a.workerExec);
 const quick=QUICK_ACTIONS.map(q=>{
  const a=actById(q.id);if(!a)return'';
  return `<button class="qa-btn" ${st.startingId==='q:'+a.id?'disabled':''} onclick="quickStart('${a.id}')"><span class="qa-icon">${st.startingId==='q:'+a.id?'⏳':q.icon}</span><span>${st.startingId==='q:'+a.id?'Starting…':esc(q.label)}</span></button>`;
 }).join('');
 return `${header()}
 <p class="link" onclick="go('scan')" style="margin-top:0;">‹ Cancel / Rescan</p>
 <h1>Confirm Assignment</h1>
 <div class="card">
  <div style="font-weight:700;font-size:16px;">📍 Bed ${esc(d.bedId)} <span class="sub" style="font-weight:400;">(Block ${esc(d.block)}${d.zone?' · Zone '+esc(d.zone):''})</span></div>
  <div class="detail-row">🌱 Crop: ${d.cropName?esc(d.cropName):'—'}</div>
  <div class="detail-row">🏷️ Cohort: ${d.cohortId?esc(d.cohortId):'—'}</div>
  <div class="detail-row">📋 Field Status: ${esc(d.status)}</div>
  <p class="link" style="margin-top:10px;margin-bottom:0;" onclick="st.showHistory=!st.showHistory;render()">${st.showHistory?'▾':'▸'} Bed History</p>
  ${st.showHistory?bedHistoryHtml(d.bedId):''}
 </div>
 ${errBanner()}
 <h1 style="font-size:16px;margin-top:16px;">Field Actions</h1>
 <div class="qa-grid">${quick}</div>
 <p class="link" onclick="st.showAllActs=!st.showAllActs;render()">${st.showAllActs?'▾':'▸'} Or Choose Any Activity</p>
 ${st.showAllActs?worker.map(a=>`<button class="act-btn ${st.selAct&&st.selAct.id===a.id?'sel':''}" onclick="selectAct('${a.id}')">${esc(a.name)}</button>`).join(''):''}
 ${st.startingId==='task'?'<div class="progress"><span class="spin"></span>Starting…</div>':`<button class="btn block" style="margin-top:10px;" ${st.startingId?'disabled':''} onclick="confirmStart('task')">${st.selAct?'▶ Start '+esc(st.selAct.name):'▶ Start Task'}</button>`}
 <button class="btn secondary block" style="margin-top:8px;" onclick="go('scan')">Cancel / Rescan</button>
 <p class="link" onclick="go('home')">‹ Back to My Sessions</p>`;
}

/** FIX: ticking used to call the full render() every second, which rebuilds the
 *  entire #app innerHTML - including whatever input the worker is mid-typing-into
 *  (Notes, Quantity, Pause reason...), since those inputs live on this same Home
 *  screen. Replacing the DOM out from under a focused input resets its cursor/
 *  selection and can even drop focus entirely - that's the "notes keeps jumping,
 *  can't type" bug. The clock only needs its own text updated each second, so
 *  this walks the visible timers by id and patches just their textContent,
 *  leaving every other element (and whatever's focused) untouched. */
function updateTimers(){
 st.sessions.forEach(s=>{
  if(s.status!=='active'&&s.status!=='paused')return;
  const elT=document.getElementById('timer-'+s.id);
  if(elT)elT.textContent=fmt(elapsed(s));
 });
}
function render(){
 const el=document.getElementById('app');
 if(st.screen==='login')el.innerHTML=renderLogin();
 else if(st.screen==='home')el.innerHTML=renderHome();
 else if(st.screen==='log')el.innerHTML=renderLog();
 else if(st.screen==='scan')el.innerHTML=renderScan();
 else if(st.screen==='assignment')el.innerHTML=renderAssignment();
 if(tickTimer)clearInterval(tickTimer);
 if(st.screen==='home'&&st.sessions.some(s=>s.status==='active'))tickTimer=setInterval(updateTimers,1000);
}
render();
</script>
</body>
</html>
